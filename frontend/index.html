<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню ресторана</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-page">
        <aside class="categories" aria-label="Категории меню">
            <h1 class="side-title">Меню</h1>
            <p class="table-indicator" id="table-indicator"></p>
            <div id="category-buttons"><!-- filled from GET /api/menu --></div>
        </aside>

        <main class="products-area">
            <div class="products-heading">
                <div>
                    <p class="eyebrow">Ресторанное меню</p>
                    <h2 id="category-title">Меню</h2>
                </div>
                <p class="products-count" id="products-count"></p>
            </div>

            <section class="products" id="products" aria-live="polite"></section>
        </main>

        <a class="cart-link" href="cart.html" aria-label="Открыть корзину">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3h2l2.4 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6M10 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm9 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/>
            </svg>
            <span class="cart-label">Корзина</span>
            <span class="cart-badge" id="cart-count">0</span>
        </a>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="dish-modal" id="dish-modal" hidden>
        <div class="dish-modal-card" role="dialog" aria-modal="true" aria-labelledby="dish-modal-title">
            <button class="dish-modal-close" id="dish-modal-close" type="button" aria-label="Закрыть описание">×</button>

            <div class="dish-modal-image">
                <img id="dish-modal-image" src="" alt="">
            </div>

            <div class="dish-modal-content">
                <p class="eyebrow">Информация о блюде</p>
                <h2 id="dish-modal-title"></h2>
                <p class="dish-description" id="dish-description"></p>

                <section class="dish-info-section">
                    <h3>Состав</h3>
                    <p id="dish-ingredients"></p>
                </section>

                <section class="dish-info-section" id="dish-options-section" hidden>
                    <h3>Дополнительно</h3>
                    <div id="dish-options-list" class="dish-options-list"></div>
                </section>

                <section class="allergy-warning" id="dish-allergy-section" hidden>
                    <span class="warning-icon" aria-hidden="true">!</span>
                    <div>
                        <h3>Возможные аллергены</h3>
                        <p id="dish-allergens"></p>
                    </div>
                </section>

                <p class="unavailable-note" id="dish-unavailable-note" hidden>Сейчас недостаточно ингредиентов для этого блюда.</p>

                <div class="dish-modal-footer">
                    <strong class="dish-modal-price" id="dish-modal-price"></strong>
                    <button class="add-cart modal-add-cart" id="dish-modal-add" type="button">Добавить в корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="script.js"></script>
</body>
</html>
