<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css?v=20261124">

    <link rel="stylesheet" href="restaurant.css?v=20261124b">
</head>
<body class="staff-body">
<a class="skip-link" href="#staff-login-screen">К содержимому</a>
<header class="brand-header"><div class="brand-header-inner"><a class="brand" href="index.html" aria-label="MAISON — меню ресторана"><strong>MAISON</strong><small>Kitchen & lounge</small></a><span class="brand-section-label">Команда ресторана</span><nav class="brand-nav" aria-label="Основная навигация"><a href="admin.html">Управление</a><a href="kitchen.html" aria-current="page">Кухня</a><a href="waiter.html">Зал</a></nav></div></header>


    <section class="staff-login-page" id="staff-login-screen" tabindex="-1">
        <div class="monitor-select-card staff-login-card">
            <p class="eyebrow">Кухня</p>
            <h1>Вход для шеф-повара</h1>
            <form id="staff-login-form" class="age-form">
                <label>Логин
                    <input type="text" id="staff-login-input" autocomplete="username" required>
                </label>
                <label>Пароль
                    <input type="password" id="staff-password-input" autocomplete="current-password" required>
                </label>
                <p class="age-form-error" id="staff-login-error" hidden></p>
                <button class="order-btn" type="submit">Войти</button>
            </form>
            <small>Демо-доступ: marat / chef123</small>
        </div>
    </section>

    <div class="staff-app" id="staff-app-screen" hidden>
        <header class="staff-header">
            <div>
                <p class="eyebrow">Кухня</p>
                <h1>Активные заказы</h1>
            </div>
            <div class="staff-header-actions">
                <span id="staff-name" class="staff-name"></span>
                <button class="secondary-btn" id="staff-logout-btn" type="button">Выйти</button>
            </div>
        </header>

        <section id="kitchen-orders" class="staff-orders" aria-live="polite"></section>
        <p class="staff-empty" id="kitchen-empty" hidden>Нет активных заказов - кухня свободна.</p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="api.js?v=20261124"></script>
    <script src="staff-auth.js?v=20261124"></script>
    <script src="kitchen.js?v=20261124"></script>
<footer class="brand-footer"><strong>MAISON</strong><p>Хороший вкус. Тёплые встречи.</p><nav aria-label="Дополнительная навигация"><a href="index.html">Меню</a><a href="account.html">Личный кабинет</a><a href="admin.html">Для команды</a></nav></footer>
</body>
</html>
